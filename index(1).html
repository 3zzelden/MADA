<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADA | مدى</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1120;color:#f1f5f9;font-family:system-ui,Arial;display:grid;place-items:center;padding:20px}.card{width:min(100%,480px);background:#111b2d;border:1px solid #26354e;border-radius:22px;padding:28px}.logo{font-size:32px;font-weight:800;color:#38bdf8}.sub,.small{color:#94a3b8}label{display:block;margin:14px 0 6px}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #35445d;background:#0b1120;color:white;font-size:16px}button{border:0;border-radius:12px;padding:13px;cursor:pointer}.primary{width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);font-weight:800;margin-top:18px}.secondary{background:transparent;color:#38bdf8;width:100%;margin-top:12px}.status{margin-top:16px;color:#cbd5e1;line-height:1.7;white-space:pre-wrap}.hide{display:none}.profile-head{display:flex;align-items:center;gap:12px;margin:16px 0}.avatar{width:64px;height:64px;border-radius:50%;background:#172c49;display:grid;place-items:center;color:#38bdf8;font-size:26px}</style></head><body><div class="card"><div class="logo">MADA | مدى</div><div class="sub">اعرض عملك، ووسّع عالمك.</div><div id="auth"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل"><div id="signupFields" class="hide"><label>اسم المستخدم</label><input id="username" placeholder="username"><label>الاسم الظاهر</label><input id="displayName" placeholder="اسمك الذي يظهر للناس"></div><button id="submit" class="primary">تسجيل الدخول</button><button id="switch" class="secondary">إنشاء حساب جديد</button><div id="status" class="status"></div></div><div id="signed" class="hide"><div class="profile-head"><div class="avatar" id="avatar">M</div><div><h2 id="profileName" style="margin:0"></h2><div id="profileUser" style="color:#94a3b8"></div></div></div><label>نبذة عنك</label><textarea id="bio" rows="3" placeholder="اكتب نبذة قصيرة..."></textarea><label>الدولة</label><input id="country" placeholder="الدولة (اختياري)"><button id="save" class="primary">حفظ البروفايل</button><div id="profileStatus" class="status"></div><button id="logout" class="secondary">تسجيل الخروج</button></div><div class="small">نسخة اختبار أولية. لا تشارك كلمة المرور أو المفاتيح السرية.</div></div><script type="module">import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://cuqsttoetvtbhgeepmhk.supabase.co','sb_publishable_wOm4bTajQHtGZEkjKHH_Pw_h0eZpr3I');const email=document.getElementById('email'),password=document.getElementById('password'),username=document.getElementById('username'),displayName=document.getElementById('displayName'),status=document.getElementById('status'),signupFields=document.getElementById('signupFields'),submit=document.getElementById('submit'),switchBtn=document.getElementById('switch');let isSignup=false,currentUser=null,currentProfile=null;function msg(s){status.textContent=s}switchBtn.onclick=()=>{isSignup=!isSignup;signupFields.classList.toggle('hide',!isSignup);submit.textContent=isSignup?'إنشاء الحساب':'تسجيل الدخول';switchBtn.textContent=isSignup?'لدي حساب بالفعل — تسجيل الدخول':'إنشاء حساب جديد';msg('')};async function loadProfile(user){currentUser=user;document.getElementById('auth').classList.add('hide');document.getElementById('signed').classList.remove('hide');const ps=document.getElementById('profileStatus');ps.textContent='جارٍ تحميل البروفايل...';let {data,error}=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error){ps.textContent='تعذر قراءة البروفايل: '+error.message;return}if(!data){const meta=user.user_metadata||{};const uname=(meta.username||user.email?.split('@')[0]||'user').replace(/[^a-zA-Z0-9_]/g,'').slice(0,24)||'user';const ins=await supabase.from('profiles').insert({id:user.id,username:uname,display_name:meta.display_name||uname}).select().single();if(ins.error){ps.textContent='الدخول يعمل، لكن إنشاء البروفايل تعذر: '+ins.error.message+' — قد نحتاج تعديل سياسة profiles.';return}data=ins.data}currentProfile=data;renderProfile(data);ps.textContent='تم تحميل البروفايل. عدّل النبذة والدولة ثم احفظ.'}function renderProfile(d){document.getElementById('profileName').textContent=d.display_name||'عضو مدى';document.getElementById('profileUser').textContent='@'+(d.username||'');document.getElementById('avatar').textContent=(d.display_name||'M').slice(0,1);document.getElementById('bio').value=d.bio||'';document.getElementById('country').value=d.country||''}submit.onclick=async()=>{msg('جارٍ التنفيذ...');const e=email.value.trim(),p=password.value;if(!e||!p){msg('اكتب البريد وكلمة المرور.');return}if(p.length<6){msg('كلمة المرور يجب ألا تقل عن 6 أحرف.');return}if(isSignup){if(!username.value.trim()||!displayName.value.trim()){msg('اكتب اسم المستخدم والاسم الظاهر.');return}const {data,error}=await supabase.auth.signUp({email:e,password:p,options:{data:{username:username.value.trim(),display_name:displayName.value.trim()}}});if(error){msg('تعذر إنشاء الحساب: '+error.message);return}if(data.session){msg('تم إنشاء الحساب.');await loadProfile(data.user)}else{msg('تم إرسال رسالة تأكيد. أكد بريدك ثم ارجع وسجل الدخول لإنشاء البروفايل.')}}else{const {data,error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error){msg('تعذر تسجيل الدخول: '+error.message);return}await loadProfile(data.user)}};document.getElementById('save').onclick=async()=>{if(!currentUser||!currentProfile)return;const ps=document.getElementById('profileStatus');ps.textContent='جارٍ الحفظ...';const {data,error}=await supabase.from('profiles').update({bio:document.getElementById('bio').value,country:document.getElementById('country').value.trim()||null}).eq('id',currentUser.id).select().single();if(error){ps.textContent='تعذر الحفظ: '+error.message;return}currentProfile=data;renderProfile(data);ps.textContent='تم حفظ البروفايل.'};document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};const {data:{session}}=await supabase.auth.getSession();if(session)await loadProfile(session.user);supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)loadProfile(session.user)});</script></body></html>
