<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADA | مدى</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1120;color:#f1f5f9;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(100%,440px);background:#111b2d;border:1px solid #26354e;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0005}
.logo{font-size:32px;font-weight:800;letter-spacing:2px;color:#38bdf8}.sub{color:#aab7cb;margin:6px 0 24px}
label{display:block;margin:14px 0 6px;color:#cbd5e1}input{width:100%;padding:13px;border-radius:12px;border:1px solid #35445d;background:#0b1120;color:white;font-size:16px}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;cursor:pointer}
.primary{width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:#06111e;font-weight:800;margin-top:18px}
.secondary{background:transparent;color:#38bdf8;margin-top:12px;width:100%}.status{margin-top:16px;color:#cbd5e1;line-height:1.7;white-space:pre-wrap}.hide{display:none}.small{font-size:13px;color:#94a3b8;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<div class="logo">MADA | مدى</div>
<div class="sub">اعرض عملك، ووسّع عالمك.</div>
<div id="auth">
<label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com">
<label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل">
<div id="signupFields" class="hide">
<label for="username">اسم المستخدم</label><input id="username" autocomplete="username" placeholder="username">
<label for="displayName">الاسم الظاهر</label><input id="displayName" placeholder="اسمك الذي يظهر للناس">
</div>
<button id="submit" class="primary">تسجيل الدخول</button>
<button id="switch" class="secondary">إنشاء حساب جديد</button>
<div id="status" class="status"></div>
</div>
<div id="signed" class="hide">
<h2>أنت مسجل الدخول!</h2><div id="account" class="status"></div>
<button id="logout" class="primary">تسجيل الخروج</button>
</div>
<div class="small">نسخة اختبار أولية — لا تشارك كلمة المرور أو المفاتيح السرية.</div>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://cuqsttoetvtbhgeepmhk.supabase.co';
const SUPABASE_KEY='sb_publishable_wOm4bTajQHtGZEkjKHH_Pw_h0eZpr3I';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const email=document.getElementById('email'), password=document.getElementById('password');
const username=document.getElementById('username'), displayName=document.getElementById('displayName');
const status=document.getElementById('status'), signupFields=document.getElementById('signupFields');
const submit=document.getElementById('submit'), switchBtn=document.getElementById('switch');
let isSignup=false;
function msg(s){status.textContent=s}
switchBtn.onclick=()=>{isSignup=!isSignup;signupFields.classList.toggle('hide',!isSignup);submit.textContent=isSignup?'إنشاء الحساب':'تسجيل الدخول';switchBtn.textContent=isSignup?'لدي حساب بالفعل — تسجيل الدخول':'إنشاء حساب جديد';msg('')};
submit.onclick=async()=>{
  msg('جارٍ التنفيذ...');
  const e=email.value.trim(), p=password.value;
  if(!e||!p){msg('اكتب البريد الإلكتروني وكلمة المرور.');return}
  if(p.length<6){msg('كلمة المرور يجب ألا تقل عن 6 أحرف.');return}
  if(isSignup){
    if(!username.value.trim()||!displayName.value.trim()){msg('اكتب اسم المستخدم والاسم الظاهر.');return}
    const {data,error}=await supabase.auth.signUp({email:e,password:p,options:{data:{username:username.value.trim(),display_name:displayName.value.trim()}}});
    if(error){msg('تعذر إنشاء الحساب: '+error.message);return}
    if(data.session){msg('تم إنشاء الحساب.');show(data.user)}else{msg('تم إرسال طلب التسجيل. لو تأكيد البريد مفعّل، افتح رسالة Supabase لتأكيد حسابك ثم سجّل الدخول.')}
  }else{
    const {data,error}=await supabase.auth.signInWithPassword({email:e,password:p});
    if(error){msg('تعذر تسجيل الدخول: '+error.message);return}
    show(data.user)
  }
};
function show(user){document.getElementById('auth').classList.add('hide');document.getElementById('signed').classList.remove('hide');document.getElementById('account').textContent='البريد: '+(user.email||'')+'\nالاسم: '+(user.user_metadata?.display_name||'لم يُحدد بعد')+'\n\nالخطوة التالية: ربط إنشاء البروفايل والمنشورات.'}
document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};
const {data:{session}}=await supabase.auth.getSession();if(session)show(session.user);
supabase.auth.onAuthStateChange((_event,session)=>{if(session)show(session.user)});
</script>
</body>
</html>
